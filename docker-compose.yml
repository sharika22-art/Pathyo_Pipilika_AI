services:
  backend:
    build: ./backend
    container_name: edu_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}   # <-- Updated to match your Gemini key
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: edu_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always